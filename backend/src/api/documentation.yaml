title: OrchestratorApp
summary: AI-powered gym assistance and workout orchestration.
version: "0.1.0"
description: |

  ## Overview

  OrchestratorApp routes gym-related questions to an exercise explainer, a workout
  routine maker, or a past-routine analyzer. Answers use the requested English or
  Spanish language. Text answers, structured routine results, and database-backed
  exercise lists share a `response`
  envelope. Each successful response also includes the `subsystem` ID selected
  by the orchestrator: `routine_maker`, `exercise_explainer`,
  `past_routines_analyzer`, or `no_system`. Questions outside the supported
  domains receive a localized no-match answer with `subsystem: no_system` and
  HTTP 200. Routing runs once per request.
  Exercise lists preserve catalog values (id, name, description, instructions,
  icon_url, anatomy_diagram_url, and two decoded media_urls) and add a localized
  llm_explanation generated separately for each exercise. Missing or ambiguous
  exercise names return text asking for clarification. Catalog images are served
  at `/database/images/`; returned paths are not rewritten.
  Routine Maker additionally requires an existing numeric `user_id`. It classifies
  new routines, saved-routine edits, draft edits, and save confirmations before
  collecting missing requirements. Its `routine` contains a list of training days
  with day_type, info and catalog-backed exercises. Drafts return
  `awaiting_confirmation` and are cached per session/user without writing SQLite.
  Only a later explicit confirmation saves a new inactive routine version and
  returns `saved` with `routine_id`; existing routines and active selection remain
  unchanged. Invalid model output is validated with up to three attempts.

  ## Authentication and permissions

  These endpoints currently require **no authentication** or authorization headers.
  The backend, not the caller, supplies Gemini credentials through server
  configuration. Never include provider credentials in a request body.

  ## Error formats

  - **422 Unprocessable Entity**: invalid chat requests return JSON with a `detail`
    array. Each entry describes the error using `loc`, `msg`, and `type`, and may
    include `input` and `ctx`.
  - **500 Internal Server Error**: unhandled configuration, provider, or processing
    failures return plain text (`Internal Server Error`) in non-debug mode, not a
    JSON error envelope. Debug deployments may expose tracebacks.

  No application-level 400, 401, 403, or 404 responses are defined for these
  operations. Unknown URLs use FastAPI's default 404 JSON response.

  ## Operational notes

  Chat requests can call Gemini and consume provider quota. Explicit conversation
  history and previous routine state are not accepted in request bodies.
  `POST /{id}/chat` requires a caller-supplied session ID in the URL. The ID is
  an opaque path segment, not an authentication credential. The latest two stored
  turns supply memory for follow-ups. Successful turns are stored in process-local
  session memory, which is lost on restart. The former `/chat` URL is not available.
  The health endpoint checks application availability only, not provider readiness.
